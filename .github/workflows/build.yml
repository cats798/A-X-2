name: Build iOS IPA (TrollStore)
on:
  push:
    tags:
      - "v*"            # 当推送以 v 开头的标签时触发
  workflow_dispatch:    # 支持手动触发

env:
  FLUTTER_VERSION: "3.32.8"

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Environment
        shell: bash
        env:
          AL_CLIENT_ID: ${{ secrets.AL_CLIENT_ID }}
          AL_CLIENT_SECRET: ${{ secrets.AL_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          CALLBACK_SCHEME: ${{ secrets.CALLBACK_SCHEME }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          GIT_CLIENT_ID: ${{ secrets.GIT_CLIENT_ID }}
          GIT_CLIENT_SECRET: ${{ secrets.GIT_CLIENT_SECRET }}
          GIT_CALLBACK_SCHEME: ${{ secrets.GIT_CALLBACK_SCHEME }}
        run: |
          cat > .env << EOF
          AL_CLIENT_ID=$AL_CLIENT_ID
          AL_CLIENT_SECRET=$AL_CLIENT_SECRET
          SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID
          SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET
          MAL_CLIENT_ID=$MAL_CLIENT_ID
          MAL_CLIENT_SECRET=$MAL_CLIENT_SECRET
          CALLBACK_SCHEME=$CALLBACK_SCHEME
          GOOGLE_BOOKS_API_KEY=$GOOGLE_BOOKS_API_KEY
          GIT_CLIENT_ID=$GIT_CLIENT_ID
          GIT_CLIENT_SECRET=$GIT_CLIENT_SECRET
          GIT_CALLBACK_SCHEME=$GIT_CALLBACK_SCHEME
          EOF

      - name: Generate localizations
        run: |
          flutter clean
          flutter pub get
          # 使用显式参数生成本地化文件
          flutter gen-l10n --arb-dir=lib/l10n --output-dir=.dart_tool/flutter_gen/gen_l10n --template-arb-file=app_en.arb
          # 将生成的文件复制到 lib/flutter_gen，确保导入路径有效
          mkdir -p lib/flutter_gen/gen_l10n
          cp -r .dart_tool/flutter_gen/gen_l10n/* lib/flutter_gen/gen_l10n/ || true
          ls -la lib/flutter_gen/gen_l10n/

      - name: Build iOS (unsigned for TrollStore)
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          ln -s ../Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos
          zip -qr ./AnymeX-iOS-${{ github.ref_name }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/*.ipa

  release:
    needs: build-ios          # 等待构建完成
    runs-on: ubuntu-latest
    permissions:              # 添加这一块
      contents: write         # 允许创建 Release
    if: startsWith(github.ref, 'refs/tags/')   # 仅当由标签触发时才创建 Release
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/*.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: |
            自动构建的 iOS 版本，适用于 TrollStore 安装。
            
            📲 使用方法：
            1. 下载 `.ipa` 文件
            2. 使用 TrollStore 打开并安装
            
            🚀 版本：${{ github.ref_name }}
          allowUpdates: true